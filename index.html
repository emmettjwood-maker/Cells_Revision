<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell Biology: Interactive Lab</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2330;--mut:#5d6575;--bd:#cfccc2;--ac:#0f766e;--hi:#c2410c;--glow:#fde68a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--tx:#e8eaee;--mut:#9aa3b2;--bd:#3d4554;--ac:#2dd4bf;--hi:#fb923c;--glow:#5b4a12}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--tx:#e8eaee;--mut:#9aa3b2;--bd:#3d4554;--ac:#2dd4bf;--hi:#fb923c;--glow:#5b4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 6px}.sub{color:var(--mut);font-size:.9rem}
.tabs,.cs,.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.pn{display:none}.pn.on{display:block}
.note{margin-top:8px;padding:8px 10px;background:var(--glow);border-radius:8px;min-height:3.2em}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin-right:4px}.dots i.on{background:var(--ac)}
svg,canvas{width:100%;height:auto;display:block}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}
input[type=range]{width:100%;max-width:380px}label{font-size:.9rem}
.t{font:12px system-ui;fill:var(--tx)}.m{font:11px system-ui;fill:var(--mut)}
table{border-collapse:collapse;font-size:.85rem;width:100%}th,td{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.sc{overflow-x:auto}
.bar{background:var(--bd);border-radius:6px;height:16px;overflow:hidden;margin:2px 0 8px;max-width:420px}.bar i{display:block;height:100%;width:0;transition:width .4s}
.big{font-size:1.2rem;font-weight:700;color:var(--ac)}
.pill{display:inline-block;width:12px;height:12px;border-radius:50%;margin:1px;background:#22c55e}
@keyframes gl{50%{opacity:.45}}.o.sel{animation:gl .9s infinite}.o.sel *{stroke:#dc2626!important;stroke-width:3!important}
</style></head><body><main>
<h1>Cell biology lab</h1>
<div class="sub">Choose a topic, then use the chips, sliders and buttons. Values in simulations are simplified.</div>
<div class="tabs" id="tabs"></div><div id="panels"></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const chips=(id,items,fn)=>{const e=$(id);e.innerHTML=items.map(t=>`<button>${t}</button>`).join('');const b=[...e.children];b.forEach((x,i)=>x.onclick=()=>{b.forEach(y=>y.classList.remove('on'));x.classList.add('on');fn(i)});b[0].click()};
const kp=l=>`<div class="card"><b>Key points</b><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const TX=(x,y,t,c='t',a='middle')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
const dot=(p,col,b,d,o={})=>{const k=o.keep||o.rep;return `<circle r="${o.r||5}" fill="${col}" opacity="0"><set attributeName="opacity" to="1" begin="${b}s"${k?'':` dur="${d}s"`}/><animateMotion path="${p}" begin="${b}s" dur="${d}s"${o.rep?' repeatCount="indefinite"':''}${o.keep?' fill="freeze"':''}/></circle>`};
const sv=(b,h=260)=>`<svg viewBox="0 0 600 ${h}">${b}</svg>`;
const ctl=(p,a)=>`<div class="ctl"><button id="${p}-prev">◀ Back</button><button id="${p}-next" class="on">Next ▶</button><button id="${p}-rst">↺ Reset</button>${a||''}<span class="dots" id="${p}-dots"></span></div><div class="note" id="${p}-note"></div>`;

const PN=[
`<div class="card"><h2>Membrane transport</h2><div class="cs" id="mb-c"></div><div id="mb-sv"></div><div class="note" id="mb-n"></div></div>
<div class="card"><h2>Surface-area-to-volume ratio</h2><label>Cell side length: <b id="sa-l"></b><br><input type="range" id="sa-r" min="1" max="10" value="2"></label><div id="sa-sv"></div><div class="note" id="sa-n"></div></div>
<div class="card"><h2>Osmosis in a plant cell (rhubarb epidermis)</h2><label>Sucrose solution outside: <b id="os-l"></b><br><input type="range" id="os-r" min="0" max="100" value="30"></label><div id="os-sv"></div><div class="note" id="os-n"></div></div>
${kp(['Fluid mosaic model: a flexible phospholipid bilayer with embedded proteins that support transport, recognition and communication.','Passive: diffusion, facilitated diffusion (channel proteins such as aquaporins, carrier proteins), osmosis. Active transport uses ATP. Endocytosis and exocytosis move bulk material.','Exchange depends on surface-area-to-volume ratio, concentration gradients and the physical and chemical properties of substances.'])}`,
`<div class="card"><h2>Cell theory</h2><div class="cs" id="ct-c"></div><div class="note" id="ct-n"></div></div>
<div class="card"><h2>Cell types and organelles</h2><div class="cs" id="ty-c"></div><div id="ce-sv"></div><div class="cs" id="og-c"></div><div class="note" id="og-n"></div><div class="sc"><table><tr><th></th><th>Prokaryotic</th><th>Eukaryotic</th></tr><tr><td>Size</td><td>Smaller</td><td>Larger</td></tr><tr><td>Organelles</td><td>No membrane-bound organelles</td><td>Membrane-bound organelles</td></tr><tr><td>DNA</td><td>In the cytoplasm (circular chromosome)</td><td>In the nucleus (linear chromosomes)</td></tr><tr><td>Organisation</td><td>Single cells only</td><td>Single-celled or multicellular</td></tr></table></div></div>
${kp(['Both cell types share many features because of a common evolutionary origin.','Plant cells: cell wall, chloroplasts, large central vacuole. Animal cells: no cell wall or chloroplasts. Fungal cells: cell wall, no chloroplasts.'])}`,
`<div class="card"><h2>Energy and matter in cells</h2><div class="cs" id="en-c"></div><div id="en-sv"></div><div class="note" id="en-n"></div></div>
<div class="card"><h2>Factors affecting the rate</h2><div class="cs" id="fa-c"></div><label><span id="f1l"></span>: <b id="f1v"></b><br><input type="range" id="f1" min="0" max="100" value="30"></label><br><label><span id="f2l"></span>: <b id="f2v"></b><br><input type="range" id="f2" min="0" max="100" value="30"></label><br><span id="f3w"><label><span id="f3l"></span>: <b id="f3v"></b><br><input type="range" id="f3" min="0" max="50" value="25"></label></span><canvas id="fa-cv" width="600" height="200"></canvas><div class="note" id="fa-n"></div></div>
${kp(['Photosynthesis converts light energy into chemical energy, mainly in chloroplasts: 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.','Aerobic respiration (usually in mitochondria) releases energy from organic molecules to make ATP. Fermentation is anaerobic and releases less energy.','ATP is the energy currency: ATP → ADP + Pi releases energy; ADP + Pi → ATP stores it.','Autotrophs make organic molecules, usually with light; heterotrophs consume organic matter. The sun is the main energy source for life.'])}`,
`<div class="card"><h2>Internal membranes increase surface area</h2><div class="cs" id="im-c"></div><label>Number of folds / stacks: <b id="im-l"></b><br><input type="range" id="im-r" min="0" max="8" value="3"></label><div id="im-sv"></div><div class="note" id="im-n"></div></div>
<div class="card"><h2>A metabolic pathway</h2><div id="mp-sv"></div>${ctl('mp')}</div>
<div class="card"><h2>Enzymes and the environment</h2><label>Temperature: <b id="e1v"></b> °C<br><input type="range" id="e1" min="0" max="70" value="37"></label><br><label>pH: <b id="e2v"></b><br><input type="range" id="e2" min="1" max="13" step=".5" value="7"></label><br><label>Substrate concentration: <b id="e3v"></b><br><input type="range" id="e3" min="0" max="100" value="60"></label><br><label>Product concentration: <b id="e4v"></b><br><input type="range" id="e4" min="0" max="100" value="0"></label><br><label><input type="checkbox" id="e5"> Chemical inhibitor present</label><div id="en2-sv"></div><div>Reaction rate<div class="bar"><i id="e-b" style="background:#0f766e"></i></div></div><div class="note" id="e-n"></div></div>
<div class="card"><h2>Chemicals that interfere with metabolism</h2><div class="cs" id="ch-c"></div><div class="note" id="ch-n"></div></div>
${kp(['Metabolism depends on internal membrane structure and specific enzymes. Cristae (mitochondria) and thylakoid/lamellae membranes (chloroplasts) increase surface area.','Metabolic pathways (glycolysis, Krebs cycle, photosynthesis) have many regulated steps; each needs a specific enzyme and loses some energy as heat; some steps form intermediates.','Temperature, pH, substrate and product concentration and inhibitors affect enzymes; specificity depends on protein shape.'])}`,
`<div class="card"><h2>Cell division</h2><div class="cs" id="dv-c"></div><div id="dv-sv"></div>${ctl('dv','<button id="dv-flip">⇄ Flip orientation of short pair</button>')}</div>
<div class="card"><h2>Haploid, diploid and fertilisation</h2><div class="cs" id="hd-c"></div><div id="hd-sv"></div><div class="note" id="hd-n"></div></div>
<div class="card"><div class="sc"><table><tr><th></th><th>Binary fission</th><th>Mitosis</th><th>Meiosis</th></tr><tr><td>Occurs in</td><td>Prokaryotes</td><td>Somatic eukaryotic cells</td><td>Germ-line cells</td></tr><tr><td>Daughter cells</td><td>2, same chromosome type and number</td><td>2, genetically similar, same chromosome number</td><td>4 haploid cells, genetically different</td></tr><tr><td>Purpose</td><td>Reproduction, continuity of life</td><td>Growth and repair</td><td>Gametes for sexual reproduction</td></tr><tr><td>Variation</td><td>None (identical)</td><td>None</td><td>Crossing over, independent assortment</td></tr></table></div></div>
${kp(['All cells arise from pre-existing cells; DNA is replicated before division so each new cell gets genetic material.','Meiosis increases variation by crossing over and independent assortment; fertilisation restores the diploid number. Sexual reproduction creates more variation than asexual.'])}`,
`<div class="card"><h2>The cell cycle and its control</h2><div class="cs" id="cc-c"></div><div class="sc"><div style="min-width:560px" id="cc-sv"></div></div><div>Cells: <span class="big" id="cc-n"></span></div><div id="cc-d"></div><div class="note" id="cc-t"></div></div>
<div class="card"><h2>Cell culture</h2><div class="ctl"><label><input type="checkbox" id="cu-ok" checked> Suitable conditions (temperature, pH, oxygen)</label><button id="cu-f" class="on">Add fresh medium</button><button id="cu-r">↺ Restart</button></div><canvas id="cu-cv" width="600" height="140"></canvas>
<div>Nutrients<div class="bar"><i id="cu-n" style="background:#16a34a"></i></div>Wastes<div class="bar"><i id="cu-w" style="background:#a16207"></i></div></div><div class="note" id="cu-t"></div></div>
<div class="card"><h2>Genetic manipulation of cells</h2><div class="cs" id="gm-c"></div><div class="note" id="gm-n"></div></div>
${kp(['The cell cycle has growth, DNA replication and division, with checkpoints that decide whether the cell proceeds; gene products help control it. Hormones such as human growth hormone can regulate division.','Carcinogens (substances in tobacco smoke, dioxins, asbestos) cause mutations in regulatory genes, so cell cycle control is lost.','Cell culture needs suitable nutrients, environmental conditions and waste removal.'])}`];
$('#panels').innerHTML=PN.map((h,i)=>`<section class="pn" id="p${i}">${h}</section>`).join('');
$('#tabs').innerHTML=['1 Membrane & transport','2 Cell structure','3 Energy & ATP','4 Metabolism & enzymes','5 Cell division','6 Cell cycle & culture'].map((t,i)=>`<button onclick="tab(${i})">${t}</button>`).join('');
function tab(i){$$('.pn').forEach((p,k)=>p.classList.toggle('on',k==i));$$('#tabs button').forEach((b,k)=>b.classList.toggle('on',k==i))}
function mini(p,n,render,notes){let s=0;const go=k=>{s=Math.max(0,Math.min(n-1,k));render(s);$(`#${p}-dots`).innerHTML=Array.from({length:n},(_,i)=>`<i class="${i==s?'on':''}"></i>`).join('');$(`#${p}-note`).innerHTML=typeof notes=='function'?notes(s):notes[s]};
 $(`#${p}-prev`).onclick=()=>go(s-1);$(`#${p}-next`).onclick=()=>go(s+1);$(`#${p}-rst`).onclick=()=>go(0);go(0);return()=>go(s)}

/* ===== 1 membrane ===== */
const MB=[['Diffusion','Small non-polar molecules (O₂, CO₂) pass directly through the bilayer from high to low concentration. No energy is needed.'],['Facilitated: channel','Ions and polar molecules cannot cross the lipid core, so they pass through channel proteins, down their concentration gradient. No ATP.'],['Facilitated: carrier','A carrier protein binds a specific molecule (e.g. glucose), changes shape and releases it on the other side, down the gradient. No ATP.'],['Osmosis','Water moves from lower solute concentration to higher solute concentration, across the bilayer and through aquaporin channel proteins. No ATP.'],['Active transport','A carrier (pump) uses ATP to move substances against their concentration gradient, from low to high.'],['Endocytosis','The membrane folds inwards to engulf material into a vesicle (bulk transport, uses energy).'],['Exocytosis','A vesicle fuses with the membrane and releases its contents outside the cell (bulk transport, uses energy).']];
function mem(i){let o='<rect width="600" height="104" fill="#e0f2fe" opacity=".5"/><rect y="156" width="600" height="104" fill="#fef3c7" opacity=".5"/>'+TX(30,18,'Outside the cell','m','start')+TX(30,252,'Inside the cell','m','start');
 if(i>=5){const a='M20 130 L250 130 Q300 130 350 130 L580 130',b='M20 130 L250 130 Q300 200 350 130 L580 130',c='M20 130 L250 130 Q300 60 350 130 L580 130';
  o+=`<path d="${a}" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"><animate attributeName="d" ${i==5?`values="${a};${a};${b};${b}" keyTimes="0;.2;.7;1"`:`values="${a};${a};${c};${a}" keyTimes="0;.35;.7;1"`} dur="6s" repeatCount="indefinite"/></path>`;
  o+=i==5?`<circle r="12" fill="#2563eb"><animateMotion path="M300 50 L300 120 L300 175 L300 225" keyTimes="0;.2;.7;1" dur="6s" repeatCount="indefinite"/></circle>${TX(420,60,'particle outside','m')}`:`<circle r="12" fill="#2563eb"><animateMotion path="M300 225 L300 175 L300 125 L300 45" keyTimes="0;.3;.55;1" dur="6s" repeatCount="indefinite"/></circle>${TX(420,230,'vesicle with contents','m')}`;return sv(o)}
 for(let x=20;x<590;x+=22)o+=`<line x1="${x}" y1="118" x2="${x}" y2="130" stroke="#d97706" stroke-width="2"/><line x1="${x}" y1="136" x2="${x}" y2="148" stroke="#d97706" stroke-width="2"/><circle cx="${x}" cy="113" r="7" fill="#f59e0b"/><circle cx="${x}" cy="153" r="7" fill="#f59e0b"/>`;
 const ch='<rect x="140" y="102" width="12" height="62" rx="3" fill="#818cf8"/><rect x="168" y="102" width="12" height="62" rx="3" fill="#818cf8"/>'+TX(160,176,'channel','m');
 if(i==1||i==3)o+=ch;
 if(i==2)o+=`<ellipse cx="300" cy="133" rx="22" ry="32" fill="#34d399"><animate attributeName="rx" values="22;22;10;22" keyTimes="0;.4;.6;1" dur="4s" repeatCount="indefinite"/></ellipse>`+TX(300,184,'carrier','m');
 if(i==4)o+=`<rect x="428" y="102" width="44" height="62" rx="8" fill="#fb7185"/>`+TX(450,180,'pump (carrier)','m')+TX(450,138,'ATP','k')+`<text class="m" x="500" y="138" fill="#dc2626">ATP→ADP+Pi</text>`;
 const D=(n,f)=>Array.from({length:n},(_,k)=>f(k));
 if(i==0){o+=D(10,k=>`<circle cx="${40+k*55}" cy="${40+k%3*18}" r="5" fill="#2563eb"/>`).join('')+D(2,k=>`<circle cx="${150+k*200}" cy="215" r="5" fill="#2563eb"/>`).join('')+D(4,k=>dot(`M${70+k*130} 45 L${70+k*130} 225`,'#2563eb',k*.7,2.8,{rep:1})).join('')}
 if(i==1){o+=D(8,k=>`<circle cx="${40+k*65}" cy="${40+k%3*18}" r="7" fill="#ef4444"/>`).join('')+TX(40,70,'ions (Na⁺)','m','start')+D(3,k=>dot('M160 45 L160 225','#ef4444',k*.9,2.6,{rep:1,r:7})).join('')+dot('M400 45 L400 96 L400 45','#ef4444',0,1.6,{rep:1,r:7})+TX(400,90,'✖','m')}
 if(i==2){o+=D(8,k=>`<circle cx="${40+k*65}" cy="${40+k%3*18}" r="7" fill="#16a34a"/>`).join('')+TX(40,70,'glucose','m','start')+D(2,k=>dot('M300 45 L300 133 L300 225','#16a34a',k*2,4,{rep:1,r:7})).join('')}
 if(i==3){o+=D(2,k=>`<circle cx="${80+k*220}" cy="${50}" r="10" fill="#f97316"/>`).join('')+D(8,k=>`<circle cx="${40+k*70}" cy="${200+k%3*14}" r="10" fill="#f97316"/>`).join('')+TX(300,40,'low solute','m')+TX(300,242,'high solute','m')+D(5,k=>dot('M160 45 L160 225','#38bdf8',k*.6,2.4,{rep:1,r:4})).join('')+dot('M70 45 L70 225','#38bdf8',.3,2.8,{rep:1,r:4})}
 if(i==4)o+=D(9,k=>`<circle cx="${40+k*60}" cy="${40+k%3*18}" r="6" fill="#a855f7"/>`).join('')+D(1,k=>`<circle cx="220" cy="215" r="6" fill="#a855f7"/>`).join('')+D(3,k=>dot('M450 225 L450 45','#a855f7',k*1.2,3,{rep:1,r:6})).join('');
 return sv(o)}
chips('#mb-c',MB.map(x=>x[0]),i=>{$('#mb-sv').innerHTML=mem(i);$('#mb-n').textContent=MB[i][1]+(i<5?' The membrane is a flexible phospholipid bilayer with embedded proteins (fluid mosaic).':'')});
function sa(){const s=+$('#sa-r').value,SA=6*s*s,V=s**3;$('#sa-l').textContent=s+' units';
 $('#sa-sv').innerHTML=sv(`<rect x="40" y="${230-s*20}" width="${s*20}" height="${s*20}" fill="#bbf7d0" stroke="var(--tx)" stroke-width="2"/>${TX(260,60,'Surface area = 6 × side² = '+SA,'t','start')}${TX(260,90,'Volume = side³ = '+V,'t','start')}${TX(260,120,'SA : V = '+(SA/V).toFixed(2)+' : 1','t','start')}<rect x="260" y="140" width="${SA/V/6*300}" height="18" fill="#0f766e"/>${TX(260,180,'bar shows SA:V (bigger = better exchange)','m','start')}`,250);
 $('#sa-n').textContent=s<4?'High SA:V: diffusion of gases, nutrients and wastes across the membrane is fast enough for the whole cell.':'Low SA:V: surface is small compared to volume, so exchange cannot keep up. This limits cell size; cells divide or increase surface area (folds, microvilli).'}
$('#sa-r').oninput=sa;sa();
function os(){const c=+$('#os-r').value;$('#os-l').textContent=(c/100).toFixed(2)+' M (cell sap ≈ 0.30 M)';const k=c<=30?1:Math.max(.5,1-(c-30)/110);
 const w=190*k,h=120*k,ar=c<27?`<path d="M180 90 L215 90 M420 90 L385 90" stroke="#0284c7" stroke-width="4" marker-end="url(#oa)"/>`:c>33?`<path d="M250 90 L215 90 M350 90 L385 90" stroke="#0284c7" stroke-width="4" marker-end="url(#oa)"/>`:'';
 $('#os-sv').innerHTML=sv(`<defs><marker id="oa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0284c7"/></marker></defs><rect x="195" y="25" width="210" height="130" fill="none" stroke="#16a34a" stroke-width="8"/><rect x="${300-w/2}" y="${90-h/2}" width="${w}" height="${h}" rx="10" fill="#f9a8d4" stroke="var(--tx)"/>${TX(300,94,'protoplast','t')}${ar}${TX(300,182,'cell wall (green)','m')}${TX(60,90,'water','m')}`,200);
 $('#os-n').textContent=c<27?'Outside is hypotonic (more dilute): water enters by osmosis, the cell becomes turgid and the wall resists swelling.':c>33?'Outside is hypertonic (more concentrated): water leaves, the protoplast shrinks away from the wall (plasmolysis).':'Roughly isotonic: no net movement of water. Aquaporins speed water movement either way.'}
$('#os-r').oninput=os;os();

/* ===== 2 cells ===== */
const CT=['All organisms are made of cells.','The cell is the basic unit of structure and function.','All cells arise from pre-existing cells.'];
chips('#ct-c',['Organisms are made of cells','Basic unit','From pre-existing cells'],i=>$('#ct-n').textContent='Cell theory: '+CT[i]);
const ORG=[['Nucleus','nuc','Stores DNA and controls cell activities.'],['Nucleolus','nol','Produces components of ribosomes.'],['Mitochondrion','mit','Site of aerobic respiration and ATP production.'],['Chloroplast','chl','Site of photosynthesis.'],['Vacuole','vac','Storage and support, especially in plant cells.'],['Golgi body & vesicles','gol','Golgi modifies, packages and distributes molecules.'],['Rough ER','rer','Ribosomes on its surface: helps with protein synthesis.'],['Smooth ER','ser','Lipid synthesis and detoxification.'],['Ribosomes','rib','Site of protein synthesis.'],['Lysosomes','lys','Digestion and recycling.'],['Cytoskeleton','cyt','Support, shape and internal transport.'],['Cell wall','wal','Supports and protects the cell.']];
const ALL=ORG.map(o=>o[1]),PRES={Prokaryotic:['rib','wal'],Animal:ALL.filter(k=>!['chl','wal'].includes(k)),Plant:ALL.filter(k=>k!='lys'),Fungal:ALL.filter(k=>!['chl','lys'].includes(k))};
const TN=Object.keys(PRES);let ct=0,cs=-1;
function cellSvg(){const t=TN[ct],P=PRES[t],g=(k,x)=>P.includes(k)?`<g class="o${cs==k?' sel':''}">${x}</g>`:'';let o='';
 const rib=(a)=>a.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.5" fill="#7c2d12"/>`).join('');
 if(t=='Prokaryotic'){o+=g('wal','<rect x="120" y="80" width="360" height="130" rx="60" fill="#fef9c3" stroke="#92400e" stroke-width="8"/>')+'<rect x="128" y="88" width="344" height="114" rx="54" fill="none" stroke="var(--tx)" stroke-width="2"/>'+`<path d="M200 145 q20-45 45-20 t40 20 t40-25 t30 25 q-20 35-45 15 t-40-10 t-45 10z" fill="none" stroke="#7c3aed" stroke-width="4"/>`+TX(260,170,'DNA in cytoplasm (circular)','m')+g('rib',rib([[170,110],[190,180],[330,100],[400,160],[420,120],[380,185],[150,150]]))+TX(300,235,'Prokaryote: much smaller than a eukaryote (not to scale)','m');return sv(o,260)}
 const body=t=='Animal'?'<ellipse cx="300" cy="150" rx="260" ry="130" fill="#fef3c7" stroke="var(--tx)" stroke-width="3"/>':t=='Plant'?'<rect x="40" y="20" width="520" height="260" rx="14" fill="#dcfce7" stroke="var(--tx)" stroke-width="3"/>':'<rect x="30" y="40" width="540" height="220" rx="90" fill="#fde8d3" stroke="var(--tx)" stroke-width="3"/>';
